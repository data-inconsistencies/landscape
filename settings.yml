# yaml-language-server: $schema=https://raw.githubusercontent.com/cncf/landscape2/refs/heads/main/docs/config/schema/settings.schema.json

# Landscape2 settings
#
# Reference documentation: https://github.com/cncf/landscape2/blob/v1.1.0/docs/config/settings.yml

foundation: Data Inconsistencies

# Local address. scripts/build-site.sh replaces it, and adds base_path, for the public site.
url: http://127.0.0.1:8000

description: Open source projects and products for building a data lakehouse with a SQL query engine or an analytics processing engine.

colors:
  color1: "rgba(0, 107, 204, 1)"
  color2: "rgba(255, 0, 170, 1)"
  color3: "rgba(96, 149, 214, 1)"
  color4: "rgba(0, 42, 81, 0.7)"
  color5: "rgba(1, 107, 204, 0.7)"
  color6: "rgba(0, 42, 81, 0.7)"
  color7: "rgba(180, 219, 255, 1)"

# The open table formats are what both kinds of lakehouse share, so they are shown larger.
featured_items:
  - field: subcategory
    options:
      - value: Open Table Format

footer:
  links:
    github: "https://github.com/data-inconsistencies/landscape"
    homepage: "https://data-inconsistencies.github.io/"
    youtube: "https://www.youtube.com/@datainconsistencies"
  logo: "branding/footer.svg"
  text: |
    Product names and logos are trademarks of their owners and are used only to identify the products. Being listed is not an endorsement. Template: the [CNCF cloud native landscape](https://landscape.cncf.io).

grid_items_size: medium

groups:
  - name: Data Lakehouse with SQL Query Engine
    alias: sql
    categories:
      - Compute (SQL)
      - Data Catalog
      - Data Table Format
      - Data Storage
      - Data Orchestration
      - Data Quality and Observability
      - BI and Visualization
      - Semantic Layer
  - name: Data Lakehouse with Analytics Processing Engine
    alias: analytics
    categories:
      - Compute (Python)
      - Data Catalog
      - Data Table Format
      - Data Storage
      - Data Orchestration
      - Data Quality and Observability
      - BI and Visualization
      - Semantic Layer

header:
  links:
    github: "https://github.com/data-inconsistencies/landscape"
  logo: "branding/header.svg"

# Must be a URL: landscape2 does not accept a local path here.
images:
  favicon: "https://raw.githubusercontent.com/data-inconsistencies/data-inconsistencies.github.io/main/assets/media/logo.png"

screenshot_width: 1500
