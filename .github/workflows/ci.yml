name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: make setup
      - run: scripts/install-landscape2.sh
      - run: make test
      - run: make build-public
      - name: No local address in the public build
        run: "! grep -rIl '127.0.0.1:8000' build"
