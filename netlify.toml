# Netlify only builds pull request previews. GitHub Pages serves the public site (see scripts/deploy.sh).
[build]
  # Overrides the base directory in the Netlify project settings: "build" is generated, so it is not in the repository.
  base = "."
  publish = "build"
  command = "scripts/install-landscape2.sh .venv/bin && scripts/build-site.sh preview"
  # Exit code 0 means skip the build.
  ignore = "test \"$CONTEXT\" = production"
